[package]
name = "ymmt"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "ymmt — YouTube Music Minimal TUI: minimalista, full keybinds, streaming sin anuncios"
license = "MIT"

[dependencies]
anyhow = "1.0"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync", "net", "process"] }
futures = "0.3"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["serde"] }
ratatui-image = { version = "10.0.8", default-features = false, features = ["image-defaults", "crossterm"] }
image = "0.25"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-all"] }
ytmapi-rs = { version = "0.3.3", default-features = false, features = ["reqwest", "rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
clap = { version = "4.5", features = ["derive"] }
unicode-width = "0.2"
bytes = "1.7"
regex = "1"
rustfft = "6.0"
rtrb = "0.3"

# Downloader de streams de YouTube (fork mantenido por youtui, agosto 2026).
[dependencies.rusty_ytdl]
version = "0.7.4-youtui-vendored.4"
package = "youtui-vendored-rusty_ytdl"
default-features = false
features = ["live", "search", "rustls"]

[profile.release]
lto = "thin"
strip = "symbols"
